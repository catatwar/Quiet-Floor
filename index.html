<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Rex Rush</title>
<style>
:root{--bg:#14121f;--panel:#221d33;--panel2:#2c2541;--ink:#f6ecd4;--dim:#b3a88d;--gold:#ffcc3a;--acc:#ff7a3d;--good:#62d57e;--bad:#ff5d5d;--line:#4a4166;--blue:#5ec8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;touch-action:none;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:fixed;inset:0}
#cv{position:absolute;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#touch{position:fixed;inset:0;z-index:1;touch-action:none}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.hudbtn{position:fixed;top:calc(10px + env(safe-area-inset-top));z-index:6;width:50px;height:50px;border-radius:12px;
  border:2px solid rgba(255,255,255,.4);background:rgba(20,18,31,.5);display:flex;align-items:center;justify-content:center;padding:0}
.hudbtn svg{width:26px;height:26px;fill:#fff}
.hudbtn:active{transform:scale(.92)}
#btnPause{right:calc(10px + env(safe-area-inset-right));display:none}
#btnMute{right:calc(68px + env(safe-area-inset-right))}
body.menu #btnMute{right:calc(10px + env(safe-area-inset-right))}
.tbtn{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));z-index:4;width:92px;height:92px;border-radius:50%;
  border:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.13);color:rgba(255,255,255,.9);
  font-weight:bold;font-size:16px;letter-spacing:1px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:0}
.tbtn small{font-size:20px;line-height:1}
.tbtn.on{background:rgba(255,255,255,.35);transform:scale(.94)}
#tJump{left:calc(18px + env(safe-area-inset-left))}
#tDuck{right:calc(18px + env(safe-area-inset-right))}
body.touch.playing .tbtn{display:flex}

.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:12px;
  padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(10,8,20,.55)}
.ov.show{display:flex}
.card{background:var(--panel);border:3px solid var(--line);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.45);
  padding:18px;width:100%;max-width:460px;max-height:100%;overflow-y:auto;text-align:center;touch-action:pan-y;overscroll-behavior:contain;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
h1.logo{margin:4px 0 2px;font-size:46px;line-height:1;letter-spacing:2px;color:var(--gold);text-shadow:3px 3px 0 #a8461a,6px 6px 0 rgba(0,0,0,.4)}
h1.logo span{color:var(--acc);text-shadow:3px 3px 0 #7a2410,6px 6px 0 rgba(0,0,0,.4)}
.sub{color:var(--dim);font-size:13px;margin:6px 0 12px;letter-spacing:1px}
h2{margin:2px 0 10px;font-size:30px;letter-spacing:2px;color:var(--gold);text-shadow:3px 3px 0 rgba(0,0,0,.45)}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px 0 6px}
.stat{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;min-width:110px}
.stat b{display:block;font-size:22px;color:var(--ink)}
.stat .lbl{color:var(--dim);font-size:12px;letter-spacing:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;margin:10px 0 0;border-radius:12px;
  border:3px solid #000;background:var(--panel2);color:var(--ink);font-size:20px;font-weight:bold;letter-spacing:1px;box-shadow:0 5px 0 #000;transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn.primary{background:var(--acc);color:#1b0d05}
.btn.gold{background:var(--gold);color:#2a1d00}
.btn.danger{background:#5a2030;color:#ffd0d0;font-size:15px;min-height:50px}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.muts{margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}
.mh{color:var(--dim);font-size:12px;letter-spacing:2px;margin-bottom:6px}
.togs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tog{min-height:58px;border-radius:10px;border:3px solid var(--line);background:var(--panel2);font-weight:bold;font-size:13px;padding:6px 4px;line-height:1.15}
.tog small{display:block;font-weight:normal;color:var(--dim);font-size:11px;margin-top:3px}
.tog.on{border-color:var(--good);background:#1f4a2c;color:#d9ffe2}
.tog.on small{color:#9fe0b0}
.help{color:var(--dim);font-size:12px;line-height:1.5;margin:12px 0 0}
.help b{color:var(--ink)}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.12em;
  background:radial-gradient(circle at 35% 32%,#fff6c0 0 14%,#ffd23f 15% 58%,#d99a00 59%);box-shadow:inset 0 0 0 2px #8a6200}
.big{font-size:44px;font-weight:bold;margin:2px 0;color:var(--ink);text-shadow:3px 3px 0 rgba(0,0,0,.5)}
.newbest{display:inline-block;background:var(--gold);color:#2a1d00;font-weight:bold;padding:3px 10px;border-radius:6px;font-size:14px;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.grid4 .stat{min-width:0}
/* shop */
.shophead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.shophead h2{margin:0}
.wallet{background:#3a2e0a;border:2px solid #8a6a00;border-radius:10px;padding:8px 12px;font-size:20px;font-weight:bold;color:var(--gold);white-space:nowrap}
.item{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.item .ic{flex:0 0 44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;border:2px solid #000}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:bold;font-size:16px}
.item .ds{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.3}
.item .ds em{color:var(--good);font-style:normal}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:14px;height:8px;border-radius:2px;background:#15121f;border:1px solid #000}
.pips i.f{background:var(--good)}
.buy{flex:0 0 auto;min-width:92px;min-height:52px;border-radius:10px;border:3px solid #000;background:var(--gold);color:#2a1d00;font-weight:bold;font-size:17px;box-shadow:0 4px 0 #000;padding:0 8px}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.buy.poor{background:#4a4257;color:#a69cb8}
.buy.max{background:var(--good);color:#06280f}
.item.flash{animation:flash .45s}
@keyframes flash{0%{background:#6b5a14}100%{background:var(--panel2)}}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (min-height:0) and (max-height:520px) and (orientation:landscape){
  .card{max-width:760px;padding:12px 16px}
  #ovStart .card{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
  #ovStart .muts{margin-top:0;border-top:0;padding-top:0}
  h1.logo{font-size:38px}
  .btn{min-height:50px;margin-top:8px}
  .tbtn{width:74px;height:74px;font-size:13px;background:rgba(255,255,255,.08)}
  .big{font-size:34px}
  #ovOver .card{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:center}
  #shopList{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
}
</style>
</head>
<body class="menu">
<canvas id="cv"></canvas>
<div id="touch"></div>

<button id="btnMute" class="hudbtn" aria-label="Toggle sound"></button>
<button id="btnPause" class="hudbtn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg></button>
<button id="tJump" class="tbtn" aria-label="Jump"><small>&#9650;</small>JUMP</button>
<button id="tDuck" class="tbtn" aria-label="Duck"><small>&#9660;</small>DUCK</button>

<!-- START -->
<div id="ovStart" class="ov show"><div class="card scroll">
  <div>
    <h1 class="logo">REX <span>RUSH</span></h1>
    <div class="sub">an endless desert dash</div>
    <div class="stats">
      <div class="stat"><span class="lbl">BEST</span><b id="sHi">0</b></div>
      <div class="stat"><span class="lbl">COINS</span><b><i class="coin"></i> <span id="sCoins">0</span></b></div>
    </div>
    <button class="btn primary" id="bPlay">&#9654; PLAY</button>
    <button class="btn gold" id="bShop">UPGRADE SHOP</button>
  </div>
  <div class="muts">
    <div class="mh">FUN MODES</div>
    <div class="togs">
      <button class="tog" data-m="moon">MOON<br>GRAVITY<small>floaty jumps</small></button>
      <button class="tog" data-m="turbo">TURBO<br>START<small>fast from go</small></button>
      <button class="tog" data-m="tiny">TINY<br>DINO<small>pocket rex</small></button>
    </div>
    <p class="help" id="help"></p>
  </div>
</div></div>

<!-- PAUSE -->
<div id="ovPause" class="ov"><div class="card scroll">
  <h2>PAUSED</h2>
  <div class="stats"><div class="stat"><span class="lbl">SCORE</span><b id="pScore">0</b></div><div class="stat"><span class="lbl">RUN COINS</span><b><i class="coin"></i> <span id="pCoins">0</span></b></div></div>
  <button class="btn primary" id="bResume">&#9654; RESUME</button>
  <div class="row2"><button class="btn" id="bRestart">RESTART</button><button class="btn" id="bQuit">MENU</button></div>
</div></div>

<!-- GAME OVER -->
<div id="ovOver" class="ov"><div class="card scroll">
  <div>
    <h2>GAME OVER</h2>
    <div class="big" id="oScore">0</div>
    <div id="oBest" style="min-height:24px"></div>
    <div class="grid4">
      <div class="stat"><span class="lbl">COINS</span><b><i class="coin"></i> +<span id="oCoins">0</span></b></div>
      <div class="stat"><span class="lbl">DISTANCE</span><b id="oDist">0m</b></div>
      <div class="stat"><span class="lbl">NEAR MISSES</span><b id="oNear">0</b></div>
      <div class="stat"><span class="lbl">BEST COMBO</span><b id="oCombo">0</b></div>
    </div>
  </div>
  <div>
    <button class="btn primary" id="bAgain">&#8635; PLAY AGAIN</button>
    <button class="btn gold" id="bShop2">UPGRADE SHOP (<i class="coin"></i> <span id="oTotal">0</span>)</button>
    <button class="btn" id="bMenu">MENU</button>
  </div>
</div></div>

<!-- SHOP -->
<div id="ovShop" class="ov"><div class="card scroll">
  <div class="shophead"><h2>SHOP</h2><div class="wallet"><i class="coin"></i> <span id="shCoins">0</span></div></div>
  <div id="shopList"></div>
  <button class="btn primary" id="bBack">&#9664; BACK</button>
  <button class="btn danger" id="bReset">RESET ALL PROGRESS</button>
</div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches;
if(isTouch)document.body.classList.add('touch');
let W=480,H=270,DS=2,GY=236;

/* ================= SAVE ================= */
const SAVE_KEY='rexrush_save_v1';
const defSave=()=>({hi:0,coins:0,upg:{jump:0,magnet:0,shield:0,greed:0,score:0},muted:false,mut:{moon:false,turbo:false,tiny:false}});
let save=defSave();
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
  if(s&&typeof s==='object'){const d=defSave();save=Object.assign(d,s);save.upg=Object.assign(defSave().upg,s.upg||{});save.mut=Object.assign(defSave().mut,s.mut||{});}
}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

const UPG=[
 {id:'jump',name:'Jet Boost',ic:'&#8679;',col:'#ff7a3d',max:5,base:40,mul:1.7,
  desc:l=>`Jump power <em>+${l*5}%</em>, air boost <em>+${l*8}%</em>${l>=3?' · <em>TRIPLE jump</em>':' · Lv3: triple jump'}`},
 {id:'magnet',name:'Magnet',ic:'U',col:'#ff4f7a',max:5,base:50,mul:1.65,
  desc:l=>`Pull radius <em>${55+l*14}px</em>, lasts <em>${(7+l*1.5).toFixed(1)}s</em>`},
 {id:'shield',name:'Starting Shield',ic:'&#9711;',col:'#5ec8ff',max:3,base:120,mul:2.2,
  desc:l=>l?`Start each run with <em>${l} shield charge${l>1?'s':''}</em>`:'Start runs with a shield charge'},
 {id:'greed',name:'Greed',ic:'$',col:'#ffcc3a',max:5,base:80,mul:1.8,
  desc:l=>`Coins worth <em>${1+l}</em> each, gems worth <em>${gemValue(l)}</em>`},
 {id:'score',name:'Score Booster',ic:'&#215;',col:'#62d57e',max:5,base:60,mul:1.75,
  desc:l=>`Base score gain <em>x${(1+l*0.25).toFixed(2)}</em>`},
];
function gemValue(l){return 10+l*5;}
function costOf(u,l){return Math.round(u.base*Math.pow(u.mul,l)/5)*5;}

/* ================= AUDIO ================= */
let AC=null,master=null,noiseBuf=null;
function audioInit(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=save.muted?0:0.45;master.connect(AC.destination);}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){AC.resume().catch(()=>{});}
}
function tone(f,d,type,v,f2,delay){
  if(!AC||save.muted)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.03);
}
function noise(d,v,fc,delay){
  if(!AC||save.muted)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6|0,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=fc||1200;g.gain.setValueAtTime(v||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+0.03);
}
const SFX={
  jump:()=>tone(300,0.13,'square',0.1,640),
  djump:()=>{tone(520,0.1,'square',0.09,1100);tone(800,0.1,'triangle',0.07,1500,0.04);},
  coin:()=>{tone(988,0.05,'square',0.07);tone(1319,0.11,'square',0.07,null,0.05);},
  gem:()=>{[1047,1319,1568,2093].forEach((f,i)=>tone(f,0.09,'triangle',0.12,null,i*0.05));},
  hit:()=>{noise(0.4,0.4,900);tone(200,0.4,'sawtooth',0.16,45);},
  shield:()=>{noise(0.25,0.25,3500);tone(1200,0.3,'triangle',0.14,180);},
  power:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.08,'square',0.08,null,i*0.05));},
  buy:()=>{[392,523,659,784,1047].forEach((f,i)=>tone(f,0.1,'square',0.09,null,i*0.055));tone(1568,0.25,'triangle',0.1,null,0.3);},
  warn:()=>{tone(880,0.07,'square',0.06);tone(880,0.07,'square',0.06,null,0.12);},
  mile:()=>{tone(1047,0.06,'square',0.06);tone(1568,0.1,'square',0.06,null,0.07);},
  combo:n=>{tone(520+Math.min(n,30)*30,0.12,'triangle',0.11);tone(780+Math.min(n,30)*45,0.14,'triangle',0.08,null,0.06);},
  near:()=>tone(1100,0.13,'sine',0.13,2000),
  land:()=>noise(0.05,0.05,500),
  thud:()=>noise(0.06,0.06,300),
  click:()=>tone(660,0.04,'square',0.06),
  deny:()=>tone(170,0.16,'square',0.09,110),
};

/* ================= SPRITES ================= */
function makeSprite(rows,pal){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const col=pal[r[x]];if(col){g.fillStyle=col;g.fillRect(x,y,1,1);}}});
  return c;
}
const DPAL={x:'#3e9b52',b:'#b4e07a',o:'#ffffff',d:'#2a6e39'};
const DTOP=[
'..........xxxxxxxx.',
'.........xxoxxxxxxx',
'.........xxxxxxxxxx',
'.........xxxxxxxxxx',
'.........xxxxx.....',
'.........xxxxxxxx..',
'x.......xxxxx......',
'x......xxxxxx......',
'xx....xxxxxxxxxx...',
'xxx..xxxbbbxx..x...',
'xxxxxxxbbbbxx......',
'xxxxxxxbbbbxx......',
'.xxxxxxbbbbx.......',
'..xxxxxxxxxx.......',
'...xxxxxxxx........'];
const DDEAD=DTOP.slice();DDEAD[0]='..........xxxxxxxx.';DDEAD[1]='.........oxoxxxxxxx';DDEAD[2]='.........xoxxxxxxxx';DDEAD[3]='.........oxoxxxxxxx';
const LSTAND=['....xxx.xx.........','....xx...x.........','....x....x.........','....xx...xx........'];
const LA=['....xxx.xx.........','....xx...xx........','....x..............','....xx.............'];
const LB=['....xxx.xx.........','.....x...x.........','.........x.........','.........xx........'];
const DUCKTOP=[
'.....................xxxxxxx.',
'xx......xxxxxxxxxxxxxxoxxxxxx',
'xxx...xxxxxxxxxxxxxxxxxxxxxxx',
'xxxxxxxxxxxbbbbbbbxxxxxxxxxxx',
'.xxxxxxxxxxbbbbbbbxxxxx......',
'..xxxxxxxxxxbbbbbxxx.xxxx....',
'...xxxxxxxxxxxxxxx...........',
'....xxxxxxxxxxxx.............'];
const DLA=['.....xx...xx.................','.....x.....xx................','.....xx......................'];
const DLB=['.....xx...xx.................','......x....x.................','...........xx................'];
const SPR={
  run0:makeSprite(DTOP.concat(LA),DPAL), run1:makeSprite(DTOP.concat(LB),DPAL),
  stand:makeSprite(DTOP.concat(LSTAND),DPAL), dead:makeSprite(DDEAD.concat(LSTAND),DPAL),
  duck0:makeSprite(DUCKTOP.concat(DLA),DPAL), duck1:makeSprite(DUCKTOP.concat(DLB),DPAL),
};
const STAND_BOX=[{x:9,y:0,w:10,h:8},{x:1,y:6,w:13,h:9},{x:4,y:14,w:7,h:5}];
const DUCK_BOX=[{x:0,y:0,w:29,h:7},{x:4,y:6,w:14,h:5}];
const PPAL={x:'#6b4f8a',o:'#ffe14d'};
const PTE_A=[
'.......x.............',
'.......xx............',
'....x..xxx...........',
'...xx..xxxx..........',
'..xox..xxxxx.........',
'xxxxxxxxxxxxxxxxx....',
'......xxxxxxxxxxxxxxx',
'.......xxxxxxxxxxx...',
'........xxxxxx.......'];
const PTE_B=[
'.....................',
'.....................',
'....x................',
'...xx................',
'..xox................',
'xxxxxxxxxxxxxxxxx....',
'......xxxxxxxxxxxxxxx',
'.......xxxxxxxxxxx...',
'........xxxxx........',
'........xxxx.........',
'........xxx..........',
'........xx...........'];
SPR.pteA=makeSprite(PTE_A,PPAL);SPR.pteB=makeSprite(PTE_B,PPAL);
SPR.coin=makeSprite(['..oooo..','.oyyyyo.','oyywyyyo','oywyyyyo','oyyyyyyo','oyyyyydo','.oyyddo.','..oooo..'],{o:'#9a6c00',y:'#ffd23f',w:'#fff6c0',d:'#e0a000'});
SPR.gem=makeSprite(['...cc...','..cwcc..','.cwcccC.','cccccCCc','.cccCCc.','..cCCc..','...cc...'],{c:'#4ee6ff',w:'#ffffff',C:'#1a8fc0'});
SPR.boulder=makeSprite([
'....kkkkkk....','..kkbbbbbbkk..','.kbbllbbbbbbk.','.kbllbbbbbbbk.','kbbllbbbbbbbbk','kbbbbbbbbbbbbk','kbbbbbbbbbbdbk',
'kbbbbbbbbbddbk','kbbbbbbbbbddbk','kbbbbbbbbddbbk','.kbbbbbbddbbk.','.kbbbbbbbbbbk.','..kkbbbbbbkk..','....kkkkkk....'],
{k:'#4a3426',b:'#8a6a4e',l:'#c2a184',d:'#6a4e38'});

function makeCactus(big,seed){
  let s=seed*7919+13;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const w=big?13:9,h=big?25:17,tw=big?5:3,tx=Math.floor((w-tw)/2),aw=big?3:2;
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const C1='#2f8a3e',C2='#5cbf66',C3='#1a5a26';
  g.fillStyle=C1;g.fillRect(tx,1,tw,h-1);g.fillRect(tx+1,0,tw-2,1);
  let top=h,bot=0;
  const arm=(left)=>{
    const ay=Math.floor(h*0.4+rnd()*h*0.25),up=Math.min(ay-1,Math.floor((big?4:2)+rnd()*(big?6:4)));
    const ax=left?0:w-aw;
    g.fillStyle=C1;g.fillRect(ax,ay-up,aw,up+aw);
    if(left)g.fillRect(0,ay,tx,aw);else g.fillRect(tx+tw,ay,w-(tx+tw),aw);
    g.fillStyle=C2;g.fillRect(ax,ay-up,1,up);
    top=Math.min(top,ay-up);bot=Math.max(bot,ay+aw);
  };
  const hasL=rnd()<0.85,hasR=rnd()<0.85;
  if(hasL)arm(true);if(hasR)arm(false);
  g.fillStyle=C2;g.fillRect(tx+1,1,1,h-2);
  g.fillStyle=C3;for(let y=3;y<h-1;y+=big?4:3){g.fillRect(tx+tw-1,y,1,1);if(big)g.fillRect(tx,y+2,1,1);}
  const boxes=[{x:tx,y:1,w:tw,h:h-1}];
  if(hasL||hasR)boxes.push({x:hasL?1:tx,y:top+1,w:(hasR?w-1:tx+tw)-(hasL?1:tx),h:Math.max(1,bot-top-1)});
  c.boxes=boxes;return c;
}

function spawnObstacle(){
  const d=Math.min(1,G.dist/25000);
  const opts=[['cs',30],['cl',16+12*d]];
  if(G.dist>1200)opts.push(['pt',13+12*d]);
  if(G.dist>2600)opts.push(['bo',7+8*d]);
  if(G.dist>4200)opts.push(['dr',7+10*d]);
  const type=pick(opts);
  let x=W+16,o;
  if(type==='cs'||type==='cl'){
    const big=type==='cl',pool=big?CACT_L:CACT_S;
    let n=1;if(Math.random()<(big?0.2+0.3*d:0.35+0.35*d))n++;if(!big&&Math.random()<0.15+0.3*d)n++;
    const parts=[];let w=0,h=0;
    for(let i=0;i<n;i++){const s=pool[(Math.random()*pool.length)|0];parts.push({s,dx:w});w+=s.width+(big?1:0);h=Math.max(h,s.height);}
    const boxes=[];parts.forEach(p=>p.s.boxes.forEach(b=>boxes.push({x:p.dx+b.x,y:h-p.s.height+b.y,w:b.w,h:b.h})));
    o={type:'cactus',x,y:GY-h,w,h,parts,boxes,vx:0};
  }else if(type==='pt'){
    const lvl=pick([[0,4],[1,5],[2,G.dist>5000?3:1]]);
    const y=[GY-12,GY-21,GY-38][lvl];
    x+=G.speed*0.45;
    o={type:'ptero',x,y,w:21,h:12,lvl,vx:rand(20,50),boxes:[{x:1,y:3,w:19,h:5}],warn:true,wy:y+5};
  }else if(type==='bo'){
    x+=G.speed*0.45;
    o={type:'boulder',x,y:GY-14,w:14,h:14,vx:rand(50,90),vy:-150,rot:0,boxes:[{x:2,y:2,w:10,h:10}],warn:true,wy:GY-20};
  }else{
    x+=G.speed*0.45;
    const ph=Math.random()*6.28;
    o={type:'drone',x,y:GY-26,base:GY-26,ph,w:16,h:9,vx:rand(0,25),boxes:[{x:1,y:1,w:14,h:7}],warn:true,wy:GY-26};
  }
  o.minGap=99;o.passed=false;
  G.obs.push(o);
  if(o.warn)SFX.warn();
  const gap=(0.6+Math.random()*0.55)*G.speed+125-35*d+(o.warn?G.speed*0.3:0);
  G.nextObs=G.dist+gap;
  spawnCoinsFor(o,gap);
  if(G.dist>G.nextPow){spawnPower(o.x+o.w+gap*0.5);G.nextPow=G.dist+rand(1600,2800);}
}
function addCoin(x,y,gem){G.coinsArr.push({x,y,gem:!!gem,t:Math.random()*6,mag:false});}
function spawnCoinsFor(o,gap){
  const r=Math.random(),cx=o.x+o.w/2;
  if((o.type==='cactus'||(o.type==='ptero'&&o.lvl===0))&&r<0.5){
    const spread=clamp(G.speed/200,1,1.8)*11;
    const peak=Math.min(52,G.jv*G.jv/(2*G.grav)*0.9);
    for(let i=0;i<7;i++){const k=(i-3)/3.4;addCoin(cx+(i-3)*spread-4,GY-10-peak*(1-k*k),i===3&&Math.random()<0.12);}
  }else if(o.type==='ptero'&&o.lvl>=1&&r<0.65){
    for(let i=0;i<5;i++)addCoin(o.x-10+i*12,GY-9);
  }else if(r<0.78){
    const start=o.x+o.w+gap*0.28,high=Math.random()<0.35;
    const y=high?GY-Math.min(84,(G.jv*G.jv/(2*G.grav))*1.25+14):GY-9;

function spawnPower(x){

/* ================= UPDATE ================= */
function playerBoxes(){
  const s=G.scale,spr=curSprite(),bx=P.duck?DUCK_BOX:STAND_BOX,ox=P.x,oy=P.y-spr.height*s;
  return bx.map(b=>({x:ox+(b.x+1)*s,y:oy+(b.y+1)*s,w:(b.w-2)*s,h:(b.h-2)*s}));
}
function curSprite(){
  if(P.dead)return SPR.dead;
  const f=Math.floor(P.anim)%2;
  if(P.duck)return f?SPR.duck1:SPR.duck0;
  if(!P.ground)return SPR.stand;
  return f?SPR.run1:SPR.run0;
}
function updatePlayer(dt){
  const duckHeld=duckSrc.size>0;
  if(P.buffer>0)P.buffer-=dt;
  if(P.ground)P.coyote=0.08;else P.coyote-=dt;
  if(P.buffer>0&&P.ground&&!P.dead){doJump(false);}
  let gm=1;
  if(P.holding&&P.vy<0&&P.holdT<0.2){gm=0.45;P.holdT+=dt;}
  if(duckHeld&&!P.ground)gm=2.7;
  if(!P.ground){
    P.vy+=G.grav*gm*dt;P.y+=P.vy*dt;
    const top=P.y-SPR.stand.height*G.scale;if(top<6){P.y=6+SPR.stand.height*G.scale;if(P.vy<0)P.vy=0;}
    if(P.y>=GY){
      const hard=P.vy>500;P.y=GY;P.vy=0;P.ground=true;P.air=G.maxAir;P.holding=false;
      if(!P.dead){SFX.land();for(let i=0;i<(hard?10:4);i++)part(P.x+rand(0,16)*G.scale,GY,rand(-80,40)-G.speed*0.3,rand(-50,-10),0.4,'#e9d6a8',2,120);if(hard)shake(2);}
    }
  }
  P.duck=P.ground&&duckHeld&&!P.dead;
  if(!P.dead){P.anim+=dt*Math.max(8,G.speed/14);}
  if(P.inv>0)P.inv-=dt;
  if(P.ground&&!P.dead&&G.speed>0){P.dustT-=dt;if(P.dustT<=0){P.dustT=0.08;part(P.x+2,GY-1,-G.speed*0.6+rand(-20,10),rand(-25,-5),0.3,'rgba(233,214,168,.8)',Math.random()<0.5?1:2,60);}}
}
function hitPlayer(o){
  if(P.inv>0)return;
  if(P.shield>0){
    P.shield--;P.inv=1.1;o.dead=true;SFX.shield();shake(6);
    burst(o.x+o.w/2,o.y+o.h/2,22,'#5ec8ff',160,0.6);burst(o.x+o.w/2,o.y+o.h/2,10,'#ffffff',120,0.4);
    popup(P.shield?'SHIELD! ('+P.shield+' left)':'SHIELD BROKEN!',P.x+10,P.y-40,'#5ec8ff',9);
    return;
  }
  P.dead=true;P.holding=false;G.state='dying';G.dieT=1.0;SFX.hit();shake(10);
  if(P.ground)P.vy=0;
  burst(P.x+10,P.y-10,20,'#ff6b4a',150,0.7);burst(P.x+10,P.y-10,12,'#ffffff',100,0.5);
}
function update(dt){
  G.time+=dt;
  if(G.state==='menu'){G.scroll+=45*dt;G.cyc+=45*dt;P.anim+=dt*9;P.y=GY;updateFx(dt);return;}
  if(G.state==='paused')return;
  if(G.state==='over'){G.overT+=dt;return;}
  const playing=G.state==='play';
  if(playing){G.t+=dt;G.speed=Math.min(540,G.base+Math.sqrt(G.dist)*1.7);}
  else{G.speed=Math.max(0,G.speed-G.speed*7*dt);G.dieT-=dt;if(G.dieT<=0){updateFx(dt);gameOver();return;}}
  const mv=G.speed*dt;G.dist+=mv;G.scroll+=mv;G.cyc+=mv;
  if(playing){
    G.score+=mv*0.055*pointMul();
    const mile=Math.floor(G.score/100);if(mile>G.lastMile){G.lastMile=mile;SFX.mile();G.flash=0.7;}
    if(G.flash>0)G.flash-=dt;
    if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
    if(G.magT>0)G.magT-=dt;
    if(G.multT>0)G.multT-=dt;
    if(G.dist>=G.nextObs)spawnObstacle();
  }
  updatePlayer(dt);
  const pb=playerBoxes();
  // obstacles
  for(const o of G.obs){
    o.x-=(G.speed+(playing?o.vx:0))*dt;
    if(o.type==='boulder'&&playing){
      o.vy+=900*dt;o.y+=o.vy*dt;o.rot+=dt*G.speed*0.08;
      if(o.y+o.h>=GY){o.y=GY-o.h;o.vy=-rand(240,275);if(o.x<W)SFX.thud();for(let i=0;i<4;i++)part(o.x+7,GY,rand(-60,60)-G.speed*0.5,rand(-40,-10),0.35,'#d9c08f',2,150);}
    }
    if(o.type==='drone')o.y=o.base+Math.sin(G.t*2.6+o.ph)*15;
    if(!playing||o.dead)continue;
    let hit=false;
    for(const b of o.boxes){
      const ob={x:o.x+b.x,y:o.y+b.y,w:b.w,h:b.h};
      for(const p of pb){
        if(overlap(p,ob)){hit=true;break;}
        if(p.x<ob.x+ob.w&&p.x+p.w>ob.x){const dy=Math.max(ob.y-(p.y+p.h),p.y-(ob.y+ob.h));if(dy<o.minGap)o.minGap=dy;}
      }
      if(hit)break;
    }
    if(hit){hitPlayer(o);if(G.state!=='play')break;continue;}
    if(!o.passed&&o.x+o.w<P.x){
      o.passed=true;
      if(o.minGap<=6&&P.inv<=0){
        G.near++;addCombo('near');const b=Math.round((20+G.combo*4)*pointMul());G.score+=20+G.combo*4;
        popup('NEAR MISS! +'+b,P.x+24,P.y-36,'#ffe14d',9);SFX.near();shake(1.5);
        burst(P.x+10,P.y-10,8,'#ffe14d',90,0.4);
      }
    }
  }
  G.obs=G.obs.filter(o=>!o.dead&&o.x+o.w>-40);
  // coins
  const pcx=P.x+10*G.scale,pcy=P.y-(P.duck?6:10)*G.scale;
  for(const c of G.coinsArr){
    c.t+=dt;c.x-=G.speed*dt;
    if(G.magT>0&&playing){
      const dx=pcx-(c.x+4),dy=pcy-(c.y+4),dd=Math.hypot(dx,dy);
      if(c.mag||dd<G.magR){c.mag=true;const sp=(420+G.speed)*dt;if(dd>0.01){c.x+=dx/dd*Math.min(sp,dd);c.y+=dy/dd*Math.min(sp,dd);}}
    }
    if(!playing||c.got)continue;
    const cb={x:c.x,y:c.y,w:8,h:8};
    for(const p of pb){if(overlap({x:p.x-2,y:p.y-2,w:p.w+4,h:p.h+4},cb)){c.got=true;break;}}
    if(c.got){
      if(c.gem){G.coins+=G.gemVal;SFX.gem();burst(c.x+4,c.y+4,14,'#4ee6ff',110,0.5);popup('+'+G.gemVal+' GEM',c.x,c.y-6,'#4ee6ff',9);addCombo('coin');addCombo('coin');}
      else{G.coins+=G.coinVal;SFX.coin();burst(c.x+4,c.y+4,6,'#ffd23f',80,0.35);popup('+'+G.coinVal,c.x,c.y-4,'#ffd23f',7);addCombo('coin');}
    }
  }
  G.coinsArr=G.coinsArr.filter(c=>!c.got&&c.x>-20);
  // power-ups
  for(const p of G.pows){
    p.t+=dt;p.x-=G.speed*dt;
    if(!playing||p.got)continue;
    const b={x:p.x-7,y:p.y-7+Math.sin(p.t*4)*2,w:14,h:14};
    for(const q of pb)if(overlap(q,b)){p.got=true;break;}
    if(p.got){
      SFX.power();burst(p.x,p.y,16,p.kind==='shield'?'#5ec8ff':p.kind==='magnet'?'#ff4f7a':'#62d57e',120,0.55);shake(2);
      if(p.kind==='shield'){P.shield=Math.min(3,P.shield+1);popup('SHIELD!',P.x+10,P.y-40,'#5ec8ff',10);}
      else if(p.kind==='magnet'){G.magT=G.magDur;G.magMax=G.magDur;popup('MAGNET!',P.x+10,P.y-40,'#ff4f7a',10);}
      else{G.multT=10;popup('2X SCORE!',P.x+10,P.y-40,'#62d57e',10);}
    }
  }
  G.pows=G.pows.filter(p=>!p.got&&p.x>-20);
  updateFx(dt);
}
function updateFx(dt){
  for(const p of G.parts){p.life-=dt;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  if(G.parts.length>400)G.parts.splice(0,G.parts.length-400);
  for(const p of G.pops){p.life-=dt;p.y-=24*dt;}
  G.pops=G.pops.filter(p=>p.life>0);
  G.shake*=Math.exp(-dt*9);if(G.shake<0.1)G.shake=0;
}

  txt(sc,pad,pad,blink?'#ffe14d':'#ffffff',14);
  txt('HI '+String(Math.max(save.hi,Math.floor(G.score))).padStart(5,'0'),pad,pad+16,'#e6dcc0',8);
  ctx.drawImage(SPR.coin,pad,pad+28);txt(String(G.coins),pad+11,pad+28,'#ffd23f',9);
  let ry=pad+42;
  const mul=pointMul();
  if(mul>1.001){txt('x'+(Math.round(mul*100)/100)+' SCORE',pad,ry,G.multT>0?'#62d57e':'#bfe8c8',7);ry+=10;}
  const bar=(label,col,t,max)=>{txt(label,pad,ry,col,7);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(pad+40,ry+2,40,4);ctx.fillStyle=col;ctx.fillRect(pad+40,ry+2,Math.round(40*clamp(t/max,0,1)),4);ry+=10;};
  if(G.magT>0)bar('MAGNET','#ff4f7a',G.magT,G.magMax);
  if(G.multT>0)bar('2X','#62d57e',G.multT,10);
  if(P.shield>0){txt('SHIELD x'+P.shield,pad,ry,'#5ec8ff',7);ry+=10;}
  if(G.combo>=2){
    const s=Math.min(14,8+G.combo*0.3);txt('COMBO x'+G.combo,pad,ry+1,'#ff9a3d',s);ry+=s+3;
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(pad,ry,60,3);ctx.fillStyle='#ff9a3d';ctx.fillRect(pad,ry,Math.round(60*G.comboT/2.4),3);
  }
  const m=save.mut,tags=[m.moon&&'MOON',m.turbo&&'TURBO',m.tiny&&'TINY'].filter(Boolean);
  if(tags.length)txt(tags.join(' · '),pad,H-12,'rgba(255,255,255,.75)',7);
}
function render(){
  const S=skyNow();
  ctx.setTransform(DS,0,0,DS,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.save();
  if(G.shake>0)ctx.translate(Math.round(rand(-G.shake,G.shake)),Math.round(rand(-G.shake,G.shake)));
  drawBg(S);drawGround(S);
  for(const c of G.coinsArr)drawCoin(c);
  for(const p of G.pows)drawPow(p);
  for(const o of G.obs)drawObs(o);
  drawPlayer();
  for(const p of G.parts){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);}
  ctx.globalAlpha=1;
  for(const p of G.pops){ctx.globalAlpha=clamp(p.life/p.max*1.6,0,1);txt(p.text,Math.round(p.x),Math.round(p.y),p.col,p.size,'left');}
  ctx.globalAlpha=1;
  ctx.restore();
  if(G.state==='dying'){ctx.fillStyle=`rgba(255,40,40,${(Math.max(0,G.dieT-0.7)*0.8).toFixed(2)})`;ctx.fillRect(0,0,W,H);}
  drawHud();
}

/* ================= LOOP ================= */
let last=performance.now(),acc=0;const STEP=1/120;
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>0.1)dt=0.1;if(dt<0)dt=0;
  acc+=dt;let n=0;while(acc>=STEP&&n<14){update(STEP);acc-=STEP;n++;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
